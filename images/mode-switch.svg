<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif">
  <rect width="1200" height="600" fill="#fafafa"/>

  <!-- Title -->
  <text x="600" y="60" text-anchor="middle" font-size="32" font-weight="700" fill="#1d1d1f">8BitDo Micro Mode Switching</text>
  <text x="600" y="92" text-anchor="middle" font-size="14" fill="#86868b">Hold combo for 3 seconds at power-on. LED color confirms mode. <tspan font-weight="600" fill="#AF52DE">Keyboard mode is required for this repo.</tspan></text>

  <!-- 4 columns -->
  <g transform="translate(50, 140)">

    <!-- ===== Keyboard mode (highlighted) ===== -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="350" rx="18" fill="#FFFFFF" stroke="#AF52DE" stroke-width="3"/>

      <!-- Mode header -->
      <rect x="20" y="20" width="220" height="36" rx="8" fill="#AF52DE"/>
      <text x="130" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="2">KEYBOARD</text>

      <!-- Required tag -->
      <rect x="80" y="70" width="100" height="20" rx="10" fill="#FFE5EC" stroke="#AF52DE" stroke-width="1"/>
      <text x="130" y="85" text-anchor="middle" font-size="10" font-weight="700" fill="#AF52DE">★ THIS REPO ★</text>

      <!-- Combo -->
      <text x="130" y="135" text-anchor="middle" font-size="12" fill="#86868b" letter-spacing="1">HOLD COMBO ON POWER-ON</text>
      <g transform="translate(130, 175)">
        <rect x="-72" y="-22" width="60" height="40" rx="8" fill="#1d1d1f"/>
        <text x="-42" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Start</text>
        <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">+</text>
        <rect x="12" y="-22" width="40" height="40" rx="8" fill="#1d1d1f"/>
        <text x="32" y="4" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">B</text>
      </g>

      <!-- LED -->
      <text x="130" y="240" text-anchor="middle" font-size="12" fill="#86868b" letter-spacing="1">LED COLOR</text>
      <circle cx="130" cy="275" r="18" fill="#AF52DE" stroke="#1d1d1f" stroke-width="1.5"/>
      <circle cx="125" cy="270" r="5" fill="#FFFFFF" opacity="0.4"/>
      <text x="130" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">Purple</text>
    </g>

    <!-- ===== Switch mode ===== -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="260" height="350" rx="18" fill="#FFFFFF" stroke="#e5e5e7" stroke-width="2"/>

      <rect x="20" y="20" width="220" height="36" rx="8" fill="#f2f2f7"/>
      <text x="130" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f" letter-spacing="2">SWITCH</text>

      <text x="130" y="135" text-anchor="middle" font-size="12" fill="#86868b" letter-spacing="1">HOLD COMBO ON POWER-ON</text>
      <g transform="translate(130, 175)">
        <rect x="-72" y="-22" width="60" height="40" rx="8" fill="#1d1d1f"/>
        <text x="-42" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Start</text>
        <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">+</text>
        <rect x="12" y="-22" width="40" height="40" rx="8" fill="#1d1d1f"/>
        <text x="32" y="4" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Y</text>
      </g>

      <text x="130" y="240" text-anchor="middle" font-size="12" fill="#86868b" letter-spacing="1">LED COLOR</text>
      <circle cx="130" cy="275" r="18" fill="#34C759" stroke="#1d1d1f" stroke-width="1.5"/>
      <circle cx="125" cy="270" r="5" fill="#FFFFFF" opacity="0.4"/>
      <text x="130" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">Green</text>
    </g>

    <!-- ===== Android mode ===== -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="260" height="350" rx="18" fill="#FFFFFF" stroke="#e5e5e7" stroke-width="2"/>

      <rect x="20" y="20" width="220" height="36" rx="8" fill="#f2f2f7"/>
      <text x="130" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f" letter-spacing="2">ANDROID</text>

      <text x="130" y="135" text-anchor="middle" font-size="12" fill="#86868b" letter-spacing="1">HOLD COMBO ON POWER-ON</text>
      <g transform="translate(130, 175)">
        <rect x="-72" y="-22" width="60" height="40" rx="8" fill="#1d1d1f"/>
        <text x="-42" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Start</text>
        <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">+</text>
        <rect x="12" y="-22" width="40" height="40" rx="8" fill="#1d1d1f"/>
        <text x="32" y="4" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">X</text>
      </g>

      <text x="130" y="240" text-anchor="middle" font-size="12" fill="#86868b" letter-spacing="1">LED COLOR</text>
      <circle cx="130" cy="275" r="18" fill="#FF3B30" stroke="#1d1d1f" stroke-width="1.5"/>
      <circle cx="125" cy="270" r="5" fill="#FFFFFF" opacity="0.4"/>
      <text x="130" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">Red</text>
    </g>

    <!-- ===== iOS mode ===== -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="260" height="350" rx="18" fill="#FFFFFF" stroke="#e5e5e7" stroke-width="2"/>

      <rect x="20" y="20" width="220" height="36" rx="8" fill="#f2f2f7"/>
      <text x="130" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f" letter-spacing="2">iOS</text>

      <text x="130" y="135" text-anchor="middle" font-size="12" fill="#86868b" letter-spacing="1">HOLD COMBO ON POWER-ON</text>
      <g transform="translate(130, 175)">
        <rect x="-72" y="-22" width="60" height="40" rx="8" fill="#1d1d1f"/>
        <text x="-42" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Start</text>
        <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">+</text>
        <rect x="12" y="-22" width="40" height="40" rx="8" fill="#1d1d1f"/>
        <text x="32" y="4" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">A</text>
      </g>

      <text x="130" y="240" text-anchor="middle" font-size="12" fill="#86868b" letter-spacing="1">LED COLOR</text>
      <circle cx="130" cy="275" r="18" fill="#FFCC00" stroke="#1d1d1f" stroke-width="1.5"/>
      <circle cx="125" cy="270" r="5" fill="#FFFFFF" opacity="0.4"/>
      <text x="130" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">Yellow</text>
    </g>

  </g>

  <!-- Footer note -->
  <text x="600" y="540" text-anchor="middle" font-size="12" font-style="italic" fill="#86868b">⚠️  LED colors may vary slightly by firmware version. Check 8BitDo official docs if your unit differs.</text>
</svg>
