<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif">
  <rect width="1400" height="820" fill="#fafafa"/>

  <!-- Title -->
  <text x="700" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#1d1d1f">8BitDo Micro × Karabiner</text>
  <text x="700" y="85" text-anchor="middle" font-size="15" fill="#86868b">Mac AI Productivity Keymap — 17 buttons mapped for hands-off Claude Code, Ghostty &amp; Raycast</text>

  <!-- ====== Column 1: Pad illustration ====== -->
  <g transform="translate(50, 140)">
    <text x="200" y="20" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#86868b">PHYSICAL LAYOUT</text>

    <!-- Pad capsule -->
    <rect x="50" y="155" width="300" height="150" rx="75" fill="#aede9a" stroke="#1d1d1f" stroke-width="1.5"/>

    <!-- Shoulder buttons (top edge) -->
    <rect x="80" y="147" width="32" height="14" rx="4" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
    <text x="96" y="158" font-size="9" text-anchor="middle" fill="#1d1d1f">L2</text>
    <rect x="118" y="147" width="32" height="14" rx="4" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
    <text x="134" y="158" font-size="9" text-anchor="middle" fill="#1d1d1f">L</text>

    <rect x="250" y="147" width="32" height="14" rx="4" fill="#FFFFFF" stroke="#34C759" stroke-width="2"/>
    <text x="266" y="158" font-size="9" text-anchor="middle" font-weight="700" fill="#34C759">R</text>
    <rect x="288" y="147" width="32" height="14" rx="4" fill="#FFFFFF" stroke="#34C759" stroke-width="2"/>
    <text x="304" y="158" font-size="9" text-anchor="middle" font-weight="700" fill="#34C759">R2</text>

    <!-- D-pad -->
    <g transform="translate(120, 225)">
      <rect x="-25" y="-8" width="50" height="16" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <rect x="-8" y="-25" width="16" height="50" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <text x="0" y="-13" font-size="9" text-anchor="middle" fill="#1d1d1f">▲</text>
      <text x="0" y="22" font-size="9" text-anchor="middle" fill="#1d1d1f">▼</text>
      <text x="-18" y="3" font-size="9" text-anchor="middle" fill="#1d1d1f">◀</text>
      <text x="18" y="3" font-size="9" text-anchor="middle" fill="#1d1d1f">▶</text>
    </g>

    <!-- Logo -->
    <text x="200" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#3d3d3d">8BitDo</text>
    <text x="200" y="237" text-anchor="middle" font-size="8" fill="#666">micro</text>

    <!-- ABXY (right of pad) -->
    <g transform="translate(290, 225)">
      <circle cx="-12" cy="-12" r="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <text x="-12" y="-9" font-size="10" text-anchor="middle" fill="#1d1d1f">Y</text>
      <circle cx="12" cy="-12" r="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <text x="12" y="-9" font-size="10" text-anchor="middle" fill="#1d1d1f">X</text>
      <circle cx="-12" cy="12" r="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <text x="-12" y="15" font-size="10" text-anchor="middle" fill="#1d1d1f">A</text>
      <circle cx="12" cy="12" r="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <text x="12" y="15" font-size="10" text-anchor="middle" fill="#1d1d1f">B</text>
    </g>

    <!-- Upper small buttons: − and + (above the logo) -->
    <g transform="translate(200, 188)">
      <circle cx="-22" cy="0" r="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <text x="-22" y="3" font-size="9" text-anchor="middle" fill="#1d1d1f">−</text>
      <circle cx="22" cy="0" r="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <text x="22" y="3" font-size="9" text-anchor="middle" fill="#1d1d1f">+</text>
    </g>

    <!-- Lower small buttons: ★ (Star, dead key) and ⌂ (Home) -->
    <g transform="translate(200, 273)">
      <circle cx="-22" cy="0" r="6" fill="#ffffff" stroke="#aaa" stroke-width="1" stroke-dasharray="2 1"/>
      <text x="-22" y="3" font-size="8" text-anchor="middle" fill="#aaa">★</text>
      <circle cx="22" cy="0" r="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
      <text x="22" y="3" font-size="8" text-anchor="middle" fill="#1d1d1f">⌂</text>
    </g>

    <!-- Caption under pad -->
    <text x="200" y="350" text-anchor="middle" font-size="11" fill="#86868b">Buttons in <tspan font-weight="700" fill="#34C759">green</tspan> are modifier keys (hold)</text>
    <text x="200" y="368" text-anchor="middle" font-size="11" fill="#86868b">Buttons in <tspan font-style="italic" fill="#aaa">dashed</tspan> are dead keys (no HID event)</text>
  </g>

  <!-- ====== Column 2: Default mappings ====== -->
  <g transform="translate(480, 140)">
    <text x="200" y="20" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#86868b">DEFAULT MAPPINGS</text>

    <g font-size="14">
      <!-- L -->
      <text x="20" y="65" font-weight="700" fill="#007AFF">L</text>
      <text x="60" y="65" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Fn</text>
      <text x="180" y="65" font-size="11" fill="#86868b">Push-to-talk dictation</text>

      <!-- L2 -->
      <text x="20" y="95" font-weight="700" fill="#007AFF">L2</text>
      <text x="60" y="95" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+Tab</text>
      <text x="180" y="95" font-size="11" fill="#86868b">App switcher</text>

      <!-- A -->
      <text x="20" y="125" font-weight="700" fill="#007AFF">A</text>
      <text x="60" y="125" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Enter</text>
      <text x="180" y="125" font-size="11" fill="#86868b">Approve / Confirm</text>

      <!-- B -->
      <text x="20" y="155" font-weight="700" fill="#007AFF">B</text>
      <text x="60" y="155" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Esc</text>
      <text x="180" y="155" font-size="11" fill="#86868b">Cancel / Interrupt Claude</text>

      <!-- X -->
      <text x="20" y="185" font-weight="700" fill="#007AFF">X</text>
      <text x="60" y="185" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Tab</text>
      <text x="180" y="185" font-size="11" fill="#86868b">Autocomplete / accept</text>

      <!-- Y -->
      <text x="20" y="215" font-weight="700" fill="#007AFF">Y</text>
      <text x="60" y="215" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Shift+Tab</text>
      <text x="180" y="215" font-size="11" fill="#86868b">Claude Code mode toggle</text>

      <!-- D-pad -->
      <text x="20" y="245" font-weight="700" fill="#007AFF">↑↓←→</text>
      <text x="100" y="245" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Arrows</text>
      <text x="220" y="245" font-size="11" fill="#86868b">Menu navigation</text>

      <!-- Select -->
      <text x="20" y="275" font-weight="700" fill="#007AFF">−</text>
      <text x="60" y="275" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+`</text>
      <text x="180" y="275" font-size="11" fill="#86868b">Quick terminal (Ghostty)</text>

      <!-- Start -->
      <text x="20" y="305" font-weight="700" fill="#007AFF">+</text>
      <text x="60" y="305" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+Space</text>
      <text x="180" y="305" font-size="11" fill="#86868b">Raycast / Spotlight</text>

      <!-- Home -->
      <text x="20" y="335" font-weight="700" fill="#007AFF">⌂</text>
      <text x="60" y="335" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Ctrl+↑</text>
      <text x="180" y="335" font-size="11" fill="#86868b">Mission Control</text>

      <!-- Star -->
      <text x="20" y="365" font-weight="700" fill="#aaa">★</text>
      <text x="60" y="365" font-style="italic" fill="#aaa" font-family="ui-monospace, Menlo, monospace">—  Dead key</text>
      <text x="180" y="365" font-size="11" fill="#aaa">No HID event in Keyboard mode</text>
    </g>
  </g>

  <!-- ====== Column 3: Modifier layers ====== -->
  <g transform="translate(910, 140)">
    <text x="220" y="20" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#86868b">MODIFIER LAYERS</text>

    <!-- R modifier card -->
    <rect x="0" y="40" width="440" height="180" rx="14" fill="#FFFFFF" stroke="#34C759" stroke-width="2"/>
    <text x="20" y="68" font-size="20" font-weight="800" fill="#34C759">R</text>
    <text x="50" y="68" font-size="13" font-weight="700" fill="#1d1d1f">SPLIT MODIFIER</text>
    <text x="50" y="86" font-size="11" fill="#86868b">Hold and combine with arrows. Single press = no action.</text>

    <text x="20" y="120" font-size="13" font-weight="700" fill="#AF52DE" font-family="ui-monospace, Menlo, monospace">R + ↑</text>
    <text x="105" y="120" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+Opt+↑</text>
    <text x="260" y="120" font-size="11" fill="#86868b">Ghostty: upper split</text>

    <text x="20" y="143" font-size="13" font-weight="700" fill="#AF52DE" font-family="ui-monospace, Menlo, monospace">R + ↓</text>
    <text x="105" y="143" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+Opt+↓</text>
    <text x="260" y="143" font-size="11" fill="#86868b">Ghostty: lower split</text>

    <text x="20" y="166" font-size="13" font-weight="700" fill="#AF52DE" font-family="ui-monospace, Menlo, monospace">R + ←</text>
    <text x="105" y="166" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+Opt+←</text>
    <text x="260" y="166" font-size="11" fill="#86868b">Ghostty: left split</text>

    <text x="20" y="189" font-size="13" font-weight="700" fill="#AF52DE" font-family="ui-monospace, Menlo, monospace">R + →</text>
    <text x="105" y="189" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+Opt+→</text>
    <text x="260" y="189" font-size="11" fill="#86868b">Ghostty: right split</text>

    <!-- R2 modifier card -->
    <rect x="0" y="240" width="440" height="130" rx="14" fill="#FFFFFF" stroke="#34C759" stroke-width="2"/>
    <text x="20" y="268" font-size="20" font-weight="800" fill="#34C759">R2</text>
    <text x="60" y="268" font-size="13" font-weight="700" fill="#1d1d1f">TAB MODIFIER</text>
    <text x="60" y="286" font-size="11" fill="#86868b">Hold and combine with ←/→. Single press = no action.</text>

    <text x="20" y="320" font-size="13" font-weight="700" fill="#FF2D55" font-family="ui-monospace, Menlo, monospace">R2 + ←</text>
    <text x="120" y="320" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+Shift+←</text>
    <text x="290" y="320" font-size="11" fill="#86868b">Previous tab</text>

    <text x="20" y="343" font-size="13" font-weight="700" fill="#FF2D55" font-family="ui-monospace, Menlo, monospace">R2 + →</text>
    <text x="120" y="343" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→  Cmd+Shift+→</text>
    <text x="290" y="343" font-size="11" fill="#86868b">Next tab</text>
  </g>

  <!-- ====== Footer / Legend ====== -->
  <g transform="translate(50, 730)">
    <rect x="0" y="-20" width="1300" height="1" fill="#e5e5e7"/>
    <text x="0" y="5" font-size="11" font-weight="700" letter-spacing="2" fill="#86868b">LEGEND</text>

    <circle cx="10" cy="35" r="5" fill="#007AFF"/>
    <text x="22" y="38" font-size="12" fill="#1d1d1f">Default layer (single press)</text>

    <circle cx="240" cy="35" r="5" fill="#34C759"/>
    <text x="252" y="38" font-size="12" fill="#1d1d1f">Modifier key (hold)</text>

    <circle cx="420" cy="35" r="5" fill="#AF52DE"/>
    <text x="432" y="38" font-size="12" fill="#1d1d1f">R + arrow combo</text>

    <circle cx="600" cy="35" r="5" fill="#FF2D55"/>
    <text x="612" y="38" font-size="12" fill="#1d1d1f">R2 + arrow combo</text>

    <text x="0" y="65" font-size="11" font-style="italic" fill="#86868b">
      All rules are device-bound (vendor_id 11720 / product_id 36897). Regular keyboards remain unaffected — typing g/h/i/j/k/l/m/n/o/r/s on a Magic Keyboard works normally.
    </text>
  </g>
</svg>
